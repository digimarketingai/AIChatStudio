<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工作室建構器 | 免費模型視覺化生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    .drag-over { outline: 2px dashed #4f46e5; outline-offset: -4px; background-color: rgba(79, 70, 229, 0.04); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden font-sans">

  <!-- 頂部極簡導覽列 -->
  <header class="h-14 border-b border-slate-200 bg-white flex items-center justify-between px-4 sm:px-6 shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-sm sm:text-base text-slate-900 leading-tight" data-i18n="appTitle">AI 工作室建構器</h1>
        <p class="text-[11px] text-slate-400 hidden sm:block" data-i18n="appSubtitle">免寫程式 • 預設使用 OpenRouter 免費模型</p>
      </div>
    </div>

    <!-- 中央模式切換 -->
    <div class="flex items-center bg-slate-100 p-1 rounded-2xl border border-slate-200/80">
      <button id="btnModeEdit" onclick="setMode('edit')" class="px-4 py-1.5 text-xs font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition flex items-center gap-1.5">
        <span>🎨</span>
        <span data-i18n="modeEdit">積木設計</span>
      </button>
      <button id="btnModePreview" onclick="setMode('preview')" class="px-4 py-1.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-900 transition flex items-center gap-1.5">
        <span>▶️</span>
        <span data-i18n="modePreview">即時試用</span>
      </button>
    </div>

    <!-- 右側按鈕 -->
    <div class="flex items-center gap-2">
      <button onclick="toggleLang()" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
        🌐 <span id="langLabel">EN</span>
      </button>
      <button onclick="openExportModal()" class="px-4 py-1.5 text-xs font-bold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1.5">
        <span>🚀</span>
        <span data-i18n="btnExport">匯出網頁</span>
      </button>
    </div>
  </header>

  <!-- 視覺化 3 步驟指引 -->
  <div class="bg-white border-b border-slate-200/80 px-4 py-2 flex items-center justify-center gap-3 sm:gap-8 text-xs text-slate-600 shrink-0 overflow-x-auto">
    <div class="flex items-center gap-1.5 shrink-0">
      <span class="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 font-bold text-[11px] flex items-center justify-center">1</span>
      <span class="font-medium" data-i18n="step1">選版型與積木</span>
    </div>
    <span class="text-slate-300">➔</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <span class="w-5 h-5 rounded-full bg-blue-100 text-blue-700 font-bold text-[11px] flex items-center justify-center">2</span>
      <span class="font-medium" data-i18n="step2">點「即時試用」測試免費模型</span>
    </div>
    <span class="text-slate-300">➔</span>
    <div class="flex items-center gap-1.5 shrink-0">
      <span class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 font-bold text-[11px] flex items-center justify-center">3</span>
      <span class="font-medium" data-i18n="step3">匯出上傳至 GitHub</span>
    </div>
  </div>

  <!-- 主工作區 -->
  <div class="flex-1 flex overflow-hidden">

    <!-- 左側工具列：版型選擇 + 範本 + 元件積木 -->
    <aside id="leftSidebar" class="w-72 border-r border-slate-200 bg-white flex flex-col shrink-0 overflow-y-auto p-4 space-y-5">
      
      <!-- 1. UI 排版樣式選擇 -->
      <div>
        <h2 class="text-xs font-bold text-slate-800 mb-2.5 flex items-center gap-1.5">
          <span>📐</span> <span data-i18n="layoutTitle">選擇介面排版</span>
        </h2>
        <div class="grid grid-cols-3 gap-2" id="layoutPicker"></div>
      </div>

      <!-- 2. 一鍵套用範本 -->
      <div>
        <h2 class="text-xs font-bold text-slate-800 mb-2.5 flex items-center gap-1.5">
          <span>⚡</span> <span data-i18n="templatesTitle">快速範本</span>
        </h2>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="loadTemplate('standard')" class="p-2 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 text-center transition">
            <div class="text-lg mb-0.5">✨</div>
            <div class="text-[11px] font-semibold text-slate-700" data-i18n="tplStandard">全能助手</div>
          </button>
          <button onclick="loadTemplate('minimal')" class="p-2 rounded-xl bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 text-center transition">
            <div class="text-lg mb-0.5">💬</div>
            <div class="text-[11px] font-semibold text-slate-700" data-i18n="tplMinimal">極簡對話</div>
          </button>
          <button onclick="loadTemplate('translator')" class="p-2 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-300 text-center transition">
            <div class="text-lg mb-0.5">🌏</div>
            <div class="text-[11px] font-semibold text-slate-700" data-i18n="tplTranslator">翻譯專家</div>
          </button>
        </div>
      </div>

      <!-- 3. 功能積木 -->
      <div class="flex-1">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <span>🧩</span> <span data-i18n="componentsTitle">新增功能積木</span>
          </h2>
          <span class="text-[10px] text-slate-400" data-i18n="dragHint">點擊或拖曳</span>
        </div>
        <div id="paletteList" class="grid grid-cols-2 gap-2"></div>
      </div>
    </aside>

    <!-- 中央視覺化畫布 -->
    <main class="flex-1 flex flex-col bg-slate-100/70 overflow-hidden">
      <!-- 畫布頂部簡潔設定列 -->
      <div id="canvasToolbar" class="h-11 border-b border-slate-200/80 bg-white/80 backdrop-blur px-4 flex items-center justify-between text-xs shrink-0">
        <div class="flex items-center gap-3">
          <span class="text-slate-500 font-medium" data-i18n="themeLabel">外觀主題：</span>
          <select id="themeSelect" onchange="updateGlobal('theme', this.value)" class="bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs text-slate-700 font-medium">
            <option value="light" data-i18n="themeLight">簡約淺白</option>
            <option value="dark" data-i18n="themeDark">質感深黑</option>
            <option value="indigo" data-i18n="themeIndigo">科技靛藍</option>
          </select>
          <span class="text-slate-500 font-medium ml-2" data-i18n="accentLabel">主色調：</span>
          <input type="color" id="accentPicker" value="#4f46e5" onchange="updateGlobal('accent', this.value)" class="w-6 h-6 rounded-md cursor-pointer bg-transparent border-0" />
        </div>
        <button onclick="clearCanvas()" class="text-rose-500 hover:text-rose-600 font-medium text-xs px-2 py-1 rounded-lg hover:bg-rose-50 transition">
          🗑️ <span data-i18n="clearCanvas">清空重來</span>
        </button>
      </div>

      <!-- 畫布內容區 -->
      <div class="flex-1 overflow-y-auto p-4 sm:p-8 flex justify-center">
        <div id="canvasContainer" class="w-full max-w-4xl min-h-[420px] pb-16 transition-all"
             ondragover="handleCanvasDragOver(event)"
             ondragleave="handleCanvasDragLeave(event)"
             ondrop="handleCanvasDrop(event)">
        </div>
      </div>
    </main>

    <!-- 右側簡易屬性編輯區 -->
    <aside id="rightSidebar" class="w-72 border-l border-slate-200 bg-white flex flex-col shrink-0 overflow-y-auto p-4">
      <h2 class="text-xs font-bold text-slate-800 mb-3 flex items-center gap-1.5">
        <span>✏️</span> <span data-i18n="inspectorTitle">編輯內容</span>
      </h2>
      <div id="inspectorContent" class="space-y-4 text-xs"></div>
    </aside>
  </div>

  <!-- 匯出彈窗 -->
  <div id="exportModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white border border-slate-200 rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
          <span>🚀</span> <span data-i18n="exportModalTitle">匯出並部署至 GitHub Pages</span>
        </h3>
        <button onclick="closeExportModal()" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center">✕</button>
      </div>
      <div class="p-5 overflow-y-auto space-y-4 flex-1">
        <div class="bg-emerald-50 border border-emerald-200/80 rounded-2xl p-4 text-xs text-slate-700 space-y-1.5">
          <p class="font-bold text-emerald-800" data-i18n="ghGuideTitle">免費上線 3 步驟：</p>
          <p data-i18n="ghStep1">1. 點擊下方「下載 index.html」。</p>
          <p data-i18n="ghStep2">2. 上傳至您的 GitHub 儲存庫 (Repository)。</p>
          <p data-i18n="ghStep3">3. 在 GitHub Settings → Pages 選擇 main 分支並儲存即可。</p>
        </div>
        <textarea id="exportCodeArea" readonly class="w-full h-56 bg-slate-900 rounded-2xl p-4 font-mono text-[11px] text-emerald-300 focus:outline-none"></textarea>
      </div>
      <div class="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50">
        <button onclick="copyExportCode()" class="px-4 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold transition" data-i18n="btnCopy">複製程式碼</button>
        <button onclick="downloadExportCode()" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-sm transition" data-i18n="btnDownload">下載 index.html</button>
      </div>
    </div>
  </div>

      {
        type: 'footer',
        icon: '📌',
        color: 'bg-slate-100 text-slate-600 border-slate-200',
        nameZh: '頁尾資訊',
        nameEn: 'Footer',
        defaultProps: {
          textZh: '由 OpenRouter API 驅動 (瀏覽器端運作) • 請勿在 :free 免費模型輸入敏感資料',
          textEn: 'Powered by OpenRouter API (Client-Side) • Avoid sharing sensitive data on :free models'
        }
      }
    ];

    // ================= 狀態管理 (起始為空白畫布) =================
    let state = {
      lang: 'zh',
      mode: 'edit',
      selectedId: null,
      dragSource: null,
      global: {
        studioNameZh: 'AI Chat Studio 免費工作室',
        studioNameEn: 'AI Chat Studio (Free)',
        layout: 'split',
        theme: 'light',
        accent: '#4f46e5',
        includeBilingual: true
      },
      blocks: []
    };

    let previewState = {
      apiKey: localStorage.getItem('creator_preview_apikey') || '',
      model: 'openrouter/free',
      systemPrompt: '',
      kbText: '',
      kbName: '',
      temperature: 0.7,
      messages: [],
      abortController: null,
      isGenerating: false,
      showModelTable: false
    };

    // Header 安全過濾：避免 non ISO-8859-1 字元導致 fetch 失敗
    function toHeaderAscii(str, fallback = 'AI Chat Studio') {
      const cleaned = String(str || '').replace(/[^\x20-\x7E]/g, '').trim();
      return cleaned || fallback;
    }

    // ================= 初始化 (起始頁面為空白畫布) =================
    function init() {
      renderLayoutPicker();
      renderPalette();
      renderCanvas();
      renderInspector();
      applyI18n();
    }

    function toggleLang() {
      state.lang = state.lang === 'zh' ? 'en' : 'zh';
      document.getElementById('langLabel').textContent = state.lang === 'zh' ? 'EN' : '繁體中文';
      applyI18n();
      renderLayoutPicker();
      renderPalette();
      renderCanvas();
      renderInspector();
    }

    function applyI18n() {
      const dict = i18n[state.lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
    }

    function setMode(mode) {
      state.mode = mode;
      const isEdit = mode === 'edit';
      document.getElementById('leftSidebar').classList.toggle('hidden', !isEdit);
      document.getElementById('rightSidebar').classList.toggle('hidden', !isEdit);
      document.getElementById('canvasToolbar').classList.toggle('hidden', !isEdit);

      document.getElementById('btnModeEdit').className = isEdit
        ? 'px-4 py-1.5 text-xs font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition flex items-center gap-1.5'
        : 'px-4 py-1.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-900 transition flex items-center gap-1.5';
      document.getElementById('btnModePreview').className = !isEdit
        ? 'px-4 py-1.5 text-xs font-bold rounded-xl bg-white text-indigo-600 shadow-sm transition flex items-center gap-1.5'
        : 'px-4 py-1.5 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-900 transition flex items-center gap-1.5';

      renderCanvas();
    }

    // ================= 排版樣式與積木面板 =================
    function renderLayoutPicker() {
      const isZh = state.lang === 'zh';
      document.getElementById('layoutPicker').innerHTML = LAYOUT_OPTIONS.map(l => {
        const active = state.global.layout === l.id;
        return `
          <button onclick="setLayout('${l.id}')"
                  class="p-2 rounded-xl border text-center transition ${active ? 'bg-indigo-50 border-indigo-500 text-indigo-600 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-white'}">
            ${l.svg}
            <div class="text-[11px] font-bold">${isZh ? l.nameZh : l.nameEn}</div>
          </button>`;
      }).join('');
    }

    function setLayout(layoutId) {
      state.global.layout = layoutId;
      renderLayoutPicker();
      renderCanvas();
    }

    function renderPalette() {
      const isZh = state.lang === 'zh';
      document.getElementById('paletteList').innerHTML = COMPONENT_TYPES.map(c => `
        <div draggable="true"
             ondragstart="handlePaletteDragStart(event, '${c.type}')"
             onclick="addBlock('${c.type}')"
             class="flex flex-col items-center justify-center p-2.5 rounded-2xl border ${c.color} hover:shadow-sm cursor-pointer active:scale-95 transition text-center">
          <span class="text-xl mb-1">${c.icon}</span>
          <span class="text-[11px] font-bold">${isZh ? c.nameZh : c.nameEn}</span>
        </div>
      `).join('');
    }

    function loadTemplate(name) {
      state.blocks = [];
      state.selectedId = null;
      if (name === 'standard') {
        ['header', 'apikey', 'model', 'kb', 'system', 'params', 'prompts', 'chat', 'footer'].forEach(t => addBlock(t, false));
      } else if (name === 'minimal') {
        ['header', 'apikey', 'model', 'chat', 'footer'].forEach(t => addBlock(t, false));
      } else if (name === 'translator') {
        ['header', 'apikey', 'model', 'system', 'prompts', 'chat', 'footer'].forEach(t => addBlock(t, false));
        const sys = state.blocks.find(b => b.type === 'system');
        if (sys) sys.props.defaultPrompt = '你是一位專業的中英文雙語翻譯官，請提供自然、流暢且準確的翻譯結果。';
        const pr = state.blocks.find(b => b.type === 'prompts');
        if (pr) pr.props.buttons = '翻譯成繁體中文, 翻譯成英文, 改寫為專業商務語氣';
      }
      renderCanvas();
      renderInspector();
    }

    function addBlock(type, shouldRender = true) {
      const def = COMPONENT_TYPES.find(c => c.type === type);
      if (!def) return;
      const id = 'blk_' + Math.random().toString(36).slice(2, 9);
      state.blocks.push({ id, type, props: JSON.parse(JSON.stringify(def.defaultProps)) });
      state.selectedId = id;
      if (shouldRender) {
        renderCanvas();
        renderInspector();
      }
    }

    function clearCanvas() {
      state.blocks = [];
      state.selectedId = null;
      renderCanvas();
      renderInspector();
    }

    // ================= 拖放功能 =================
    function handlePaletteDragStart(e, type) {
      state.dragSource = { kind: 'new', type };
      e.dataTransfer.effectAllowed = 'copy';
    }
    function handleBlockDragStart(e, index) {
      state.dragSource = { kind: 'move', index };
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleCanvasDragOver(e) {
      e.preventDefault();
      document.getElementById('canvasContainer').classList.add('drag-over');
    }
    function handleCanvasDragLeave() {
      document.getElementById('canvasContainer').classList.remove('drag-over');
    }
    function handleCanvasDrop(e) {
      e.preventDefault();
      document.getElementById('canvasContainer').classList.remove('drag-over');
      if (state.dragSource && state.dragSource.kind === 'new') addBlock(state.dragSource.type);
      state.dragSource = null;
    }
    function handleBlockDrop(e, targetIndex) {
      e.preventDefault();
      e.stopPropagation();
      document.getElementById('canvasContainer').classList.remove('drag-over');
      if (!state.dragSource) return;
      if (state.dragSource.kind === 'move') {
        const from = state.dragSource.index;
        if (from !== targetIndex) {
          const [moved] = state.blocks.splice(from, 1);
          state.blocks.splice(targetIndex, 0, moved);
          renderCanvas();
        }
      } else if (state.dragSource.kind === 'new') {
        const def = COMPONENT_TYPES.find(c => c.type === state.dragSource.type);
        const id = 'blk_' + Math.random().toString(36).slice(2, 9);
        state.blocks.splice(targetIndex, 0, { id, type: def.type, props: JSON.parse(JSON.stringify(def.defaultProps)) });
        state.selectedId = id;
        renderCanvas();
        renderInspector();
      }
      state.dragSource = null;
    }

    function moveBlock(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= state.blocks.length) return;
      const [moved] = state.blocks.splice(index, 1);
      state.blocks.splice(target, 0, moved);
      renderCanvas();
    }

    function removeBlock(id, e) {
      e.stopPropagation();
      state.blocks = state.blocks.filter(b => b.id !== id);
      if (state.selectedId === id) state.selectedId = null;
      renderCanvas();
      renderInspector();
    }

    function selectBlock(id) {
      state.selectedId = id;
      renderCanvas();
      renderInspector();
    }

    // ================= 繪製畫布 (依版型呈現) =================
    function renderCanvas() {
      const container = document.getElementById('canvasContainer');
      if (state.mode === 'preview') {
        renderLivePreview(container);
        return;
      }

      if (state.blocks.length === 0) {
        const dict = i18n[state.lang];
        container.innerHTML = `
          <div class="border-2 border-dashed border-slate-300 bg-white/80 rounded-3xl p-10 sm:p-14 text-center text-slate-500 flex flex-col items-center gap-4 shadow-sm">
            <div class="w-16 h-16 rounded-3xl bg-slate-100 flex items-center justify-center text-3xl">⬜</div>
            <div>
              <h3 class="text-base font-bold text-slate-800 mb-1">${dict.emptyCanvasTitle}</h3>
              <p class="text-xs text-slate-500 max-w-md mx-auto">${dict.emptyCanvas}</p>
            </div>
            <div class="flex flex-wrap justify-center gap-2 pt-2">
              <button onclick="loadTemplate('standard')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-sm transition">✨ ${dict.tplStandard}</button>
              <button onclick="loadTemplate('minimal')" class="px-4 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold transition">💬 ${dict.tplMinimal}</button>
              <button onclick="loadTemplate('translator')" class="px-4 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold transition">🌏 ${dict.tplTranslator}</button>
            </div>
          </div>`;
        return;
      }

      const layout = state.global.layout;
      const wrapperCls = layout === 'card'
        ? 'bg-white p-5 rounded-3xl shadow-lg border border-slate-200 max-w-2xl mx-auto space-y-3'
        : (layout === 'single' ? 'max-w-2xl mx-auto space-y-3' : 'space-y-3');

      if (layout === 'split') {
        const headerHtml = state.blocks.filter(b => b.type === 'header').map(b => renderEditCard(b)).join('');
        const footerHtml = state.blocks.filter(b => b.type === 'footer').map(b => renderEditCard(b)).join('');
        const leftHtml = state.blocks.filter(b => ['apikey', 'model', 'kb', 'system', 'params', 'prompts', 'empty'].includes(b.type)).map(b => renderEditCard(b)).join('');
        const rightHtml = state.blocks.filter(b => b.type === 'chat').map(b => renderEditCard(b)).join('');

        container.innerHTML = `
          <div class="space-y-3">
            ${headerHtml}
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-start">
              <div class="md:col-span-5 space-y-3">${leftHtml}</div>
              <div class="md:col-span-7 space-y-3">${rightHtml}</div>
            </div>
            ${footerHtml}
          </div>`;
      } else {
        container.innerHTML = `<div class="${wrapperCls}">${state.blocks.map(b => renderEditCard(b)).join('')}</div>`;
      }
    }

    function renderEditCard(blk) {
      const idx = state.blocks.findIndex(x => x.id === blk.id);
      const def = COMPONENT_TYPES.find(c => c.type === blk.type);
      const isSelected = state.selectedId === blk.id;
      const isZh = state.lang === 'zh';

      return `
        <div draggable="true"
             ondragstart="handleBlockDragStart(event, ${idx})"
             ondragover="event.preventDefault()"
             ondrop="handleBlockDrop(event, ${idx})"
             onclick="selectBlock('${blk.id}')"
             class="rounded-2xl border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/20 shadow-md' : 'border-slate-200 hover:border-indigo-300 shadow-sm'} bg-white p-3.5 cursor-pointer transition group">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="cursor-grab text-slate-300 hover:text-slate-500 text-xs">⋮⋮</span>
              <span class="text-base">${def.icon}</span>
              <span class="text-xs font-bold text-slate-800">${isZh ? def.nameZh : def.nameEn}</span>
            </div>
            <div class="flex items-center gap-1 opacity-70 group-hover:opacity-100">
              <button onclick="event.stopPropagation(); moveBlock(${idx}, -1)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-bold">↑</button>
              <button onclick="event.stopPropagation(); moveBlock(${idx}, 1)" class="w-6 h-6 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-[11px] font-bold">↓</button>
              <button onclick="removeBlock('${blk.id}', event)" class="w-6 h-6 rounded-lg bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white text-[11px] font-bold transition">✕</button>
            </div>
          </div>
          <div class="text-xs pointer-events-none">${renderBlockSnippet(blk)}</div>
        </div>`;
    }

    function renderBlockSnippet(blk) {
      const p = blk.props;
      const isZh = state.lang === 'zh';
      const accent = state.global.accent;
      switch (blk.type) {
        case 'header':
          return `<div class="p-3 rounded-xl bg-slate-50 flex items-center justify-between">
            <div><div class="font-bold text-sm" style="color:${accent}">${esc(isZh ? p.titleZh : p.titleEn)}</div>
            <div class="text-[11px] text-slate-500">${esc(isZh ? p.subtitleZh : p.subtitleEn)}</div></div>
            <span class="px-2 py-1 rounded-lg bg-white border border-slate-200 text-[10px] text-slate-500">🌐 中/EN</span>
          </div>`;
        case 'apikey':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 font-mono text-[11px] text-slate-400 flex justify-between"><span>•••••••• ${esc(p.placeholder)}</span><span class="text-emerald-600 font-sans">openrouter.ai/keys</span></div>`;
        case 'model':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 text-[11px] text-slate-700 flex justify-between"><span>🆓 ${esc(p.models.split(',')[0])}</span><span>↻ ▾</span></div>`;
        case 'kb':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 text-[11px] text-slate-500 flex justify-between"><span>📄 ${isZh ? '上傳 .txt / .md' : 'Upload .txt / .md'}</span><span>0 chars</span></div>`;
        case 'system':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 text-[11px] text-slate-500 truncate">${esc(p.defaultPrompt)}</div>`;
        case 'prompts':
          return `<div class="flex flex-wrap gap-1.5">${p.buttons.split(',').slice(0,3).map(b => `<span class="px-2.5 py-1 rounded-lg text-[10px] font-medium text-white" style="background:${accent}">${esc(b.trim())}</span>`).join('')}</div>`;
        case 'params':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 flex items-center gap-3">
            <div class="flex-1 h-1.5 bg-slate-200 rounded-full"><div class="h-full w-1/3 rounded-full" style="background:${accent}"></div></div>
            <span class="text-[11px] font-bold text-slate-600">${esc(p.defaultTemp)}</span>
          </div>`;
        case 'chat':
          return `<div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 space-y-2">
            <div class="inline-block bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-[11px] text-slate-600">${esc(isZh ? p.welcomeZh : p.welcomeEn)}</div>
            <div class="flex gap-1.5"><div class="flex-1 bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-[10px] text-slate-400">${esc(isZh ? p.placeholderZh : p.placeholderEn)}</div><div class="px-2.5 py-1 rounded-lg text-[10px] text-white font-bold" style="background:${accent}">${i18n[state.lang].sendBtn}</div></div>
          </div>`;
        case 'empty':
          const title = isZh ? p.titleZh : p.titleEn;
          const content = isZh ? p.contentZh : p.contentEn;
          return (title || content)
            ? `<div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5"><div class="font-bold text-slate-700">${esc(title)}</div><div class="text-slate-500 text-[11px]">${esc(content)}</div></div>`
            : `<div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl py-3 text-center text-[11px] text-slate-400">${isZh ? '空白留白／自訂區塊' : 'Empty Spacer / Custom Box'}</div>`;
        case 'footer':
          return `<div class="text-center text-[11px] text-slate-400">${esc(isZh ? p.textZh : p.textEn)}</div>`;
        default: return '';
      }
    }

    // ================= 屬性編輯器 =================
    function renderInspector() {
      const container = document.getElementById('inspectorContent');
      const blk = state.blocks.find(b => b.id === state.selectedId);
      const isZh = state.lang === 'zh';

      let html = `
        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-2.5">
          <div class="font-bold text-slate-800">${i18n[state.lang].globalSettings}</div>
          <div>
            <label class="block text-slate-500 mb-1">${i18n[state.lang].studioNameZh}</label>
            <input type="text" value="${esc(state.global.studioNameZh)}" oninput="updateGlobal('studioNameZh', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-400" />
          </div>
          <div>
            <label class="block text-slate-500 mb-1">${i18n[state.lang].studioNameEn}</label>
            <input type="text" value="${esc(state.global.studioNameEn)}" oninput="updateGlobal('studioNameEn', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-400" />
          </div>
          <label class="flex items-center gap-2 cursor-pointer pt-1">
            <input type="checkbox" ${state.global.includeBilingual ? 'checked' : ''} onchange="updateGlobal('includeBilingual', this.checked)" class="rounded border-slate-300 text-indigo-600" />
            <span class="text-slate-700 font-medium">${i18n[state.lang].includeBilingual}</span>
          </label>
        </div>`;

      if (!blk) {
        html += `<p class="text-slate-400 text-center pt-4">${i18n[state.lang].selectHint}</p>`;
        container.innerHTML = html;
        return;
      }

      const def = COMPONENT_TYPES.find(c => c.type === blk.type);
      html += `<div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-3">
        <div class="font-bold text-slate-800 flex items-center gap-1.5"><span>${def.icon}</span> ${isZh ? def.nameZh : def.nameEn}</div>`;

      Object.keys(blk.props).forEach(key => {
        const val = blk.props[key];
        const isLong = key.toLowerCase().includes('prompt') || key === 'models' || key === 'buttons' || key.toLowerCase().includes('content');
        html += `
          <div>
            <label class="block text-slate-500 mb-1">${key}</label>
            ${isLong
              ? `<textarea rows="3" oninput="updateBlockProp('${blk.id}', '${key}', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-400">${esc(val)}</textarea>`
              : `<input type="text" value="${esc(val)}" oninput="updateBlockProp('${blk.id}', '${key}', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-slate-800 focus:outline-none focus:border-indigo-400" />`
            }
          </div>`;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function updateGlobal(key, val) {
      state.global[key] = val;
      if (state.mode === 'preview' || key === 'accent') renderCanvas();
    }

    function updateBlockProp(id, key, val) {
      const blk = state.blocks.find(b => b.id === id);
      if (blk) {
        blk.props[key] = val;
        renderCanvas();
      }
    }

    // ================= 即時試用 (免費模型 + 知識庫 + 匯出MD) =================
    async function refreshFreeModels(blkId) {
      try {
        const res = await fetch('https://openrouter.ai/api/v1/models');
        const json = await res.json();
        const fetched = (json.data || [])
          .filter(m => m.id === 'openrouter/free' || m.id.endsWith(':free') || (parseFloat(m.pricing?.prompt) === 0 && parseFloat(m.pricing?.completion) === 0))
          .map(m => m.id);
        const merged = Array.from(new Set([...DEFAULT_FREE_MODELS, ...fetched]));
        const blk = state.blocks.find(b => b.id === blkId);
        if (blk && merged.length) {
          blk.props.models = merged.slice(0, 25).join(', ');
          renderCanvas();
        }
      } catch (e) {
        alert('無法取得線上免費模型列表，將繼續使用預設免費模型。');
      }
    }

    function handlePreviewKbUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        previewState.kbText = e.target.result;
        previewState.kbName = file.name;
        renderCanvas();
      };
      reader.readAsText(file);
    }

    function clearPreviewKb() {
      previewState.kbText = '';
      previewState.kbName = '';
      renderCanvas();
    }

    function exportPreviewChatMd() {
      const md = previewState.messages.map(m => `### ${m.role === 'user' ? 'User' : 'AI'}\n${m.content}\n`).join('\n');
      const blob = new Blob([md], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chat-export.md';
      a.click();
    }

    function stopPreviewGeneration() {
      if (previewState.abortController) {
        previewState.abortController.abort();
        previewState.abortController = null;
        previewState.isGenerating = false;
        renderCanvas();
      }
    }

    function renderLivePreview(container) {
      if (state.blocks.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-3xl p-10 text-center space-y-3 shadow-sm">
            <div class="text-3xl">🧩</div>
            <p class="text-sm text-slate-600">${i18n[state.lang].emptyPreview}</p>
            <button onclick="setMode('edit')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">${i18n[state.lang].modeEdit}</button>
          </div>`;
        return;
      }

      const isLight = state.global.theme === 'light';
      const cardBg = isLight ? 'bg-white border-slate-200 text-slate-900 shadow-sm' : 'bg-slate-900 border-slate-800 text-slate-100';
      const inputBg = isLight ? 'bg-slate-50 border-slate-300 text-slate-900' : 'bg-slate-950 border-slate-700 text-slate-100';
      const isZh = state.lang === 'zh';
      const accent = state.global.accent;
      const layout = state.global.layout;

      const renderPreviewBlock = (blk) => {
        const p = blk.props;
        if (blk.type === 'header') {
          return `<div class="p-5 rounded-2xl border ${cardBg} flex items-center justify-between gap-2 flex-wrap">
            <div>
              <h2 class="text-xl font-bold" style="color:${accent}">${esc(isZh ? p.titleZh : p.titleEn)}</h2>
              <p class="text-xs opacity-70 mt-0.5">${esc(isZh ? p.subtitleZh : p.subtitleEn)}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 text-[11px] font-bold">🆓 ${esc(previewState.model)}</span>
              ${state.global.includeBilingual ? `<button onclick="toggleLang()" class="px-3 py-1.5 rounded-xl border border-slate-300/60 text-xs font-medium">🌐 ${isZh ? 'EN' : '繁體中文'}</button>` : ''}
            </div>
          </div>`;
        } else if (blk.type === 'apikey') {
          const connected = !!previewState.apiKey;
          return `<div class="p-4 rounded-2xl border ${cardBg} space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold">🔑 ${esc(isZh ? p.labelZh : p.labelEn)}</label>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${connected ? 'bg-emerald-500/15 text-emerald-600' : 'bg-slate-500/15 text-slate-500'}">${connected ? (isZh ? '已儲存' : 'Connected') : (isZh ? '未連線' : 'Not Connected')}</span>
            </div>
            <div class="flex gap-1.5">
              <input type="password" value="${esc(previewState.apiKey)}" placeholder="${esc(p.placeholder)}"
                     oninput="previewState.apiKey=this.value.trim(); localStorage.setItem('creator_preview_apikey', this.value.trim())"
                     class="flex-1 px-3 py-2 rounded-xl border text-xs ${inputBg}" />
              <button onclick="previewState.apiKey=''; localStorage.removeItem('creator_preview_apikey'); renderCanvas()" class="px-2.5 py-1.5 rounded-xl border border-slate-300/50 text-[11px]">${isZh ? '清除' : 'Clear'}</button>
            </div>
            <p class="text-[10px] opacity-65">${isZh ? '僅儲存於瀏覽器本機。免費申請金鑰：' : 'Stored locally. Get a free key at '}<a href="https://openrouter.ai/keys" target="_blank" class="underline text-indigo-500">openrouter.ai/keys</a></p>
          </div>`;
        } else if (blk.type === 'model') {
          const models = p.models.split(',').map(m => m.trim()).filter(m => m === 'openrouter/free' || m.endsWith(':free'));
          if (models.length === 0) models.push('openrouter/free');
          if (!models.includes(previewState.model)) previewState.model = models[0];
          const meta = FREE_MODEL_CATALOG.find(c => c.id === previewState.model);

          return `<div class="p-4 rounded-2xl border ${cardBg} space-y-2.5">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold">🆓 ${esc(isZh ? p.labelZh : p.labelEn)}</label>
              <div class="flex items-center gap-1.5">
                <button onclick="previewState.showModelTable=!previewState.showModelTable; renderCanvas()" class="px-2 py-0.5 rounded-lg border border-slate-300/50 text-[10px] hover:bg-slate-500/10">${isZh ? '模型一覽' : 'Guide'}</button>
                <button onclick="refreshFreeModels('${blk.id}')" title="${isZh ? '更新免費模型' : 'Refresh Free Models'}" class="px-2 py-0.5 rounded-lg border border-slate-300/50 text-xs hover:bg-slate-500/10">↻</button>
              </div>
            </div>
            <select onchange="previewState.model=this.value; renderCanvas()" class="w-full px-3 py-2 rounded-xl border text-xs ${inputBg}">
              ${models.map(m => {
                const info = FREE_MODEL_CATALOG.find(c => c.id === m);
                const label = info ? `${m}（${info.scene}・${info.ctx}）` : m;
                return `<option value="${esc(m)}" ${m === previewState.model ? 'selected' : ''}>${esc(label)}</option>`;
              }).join('')}
            </select>
            ${meta ? `<div class="text-[11px] px-2.5 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex flex-wrap gap-x-2 gap-y-0.5">
              <span class="font-bold">${esc(meta.scene)}</span>
              <span class="opacity-70">Context: ${esc(meta.ctx)}</span>
              <span class="opacity-80">• ${esc(meta.note)}</span>
            </div>` : ''}
            ${previewState.showModelTable ? `<div class="overflow-x-auto border border-slate-200/60 rounded-xl">
              <table class="w-full text-left text-[10px]">
                <thead class="bg-slate-500/10"><tr><th class="p-1.5">模型 ID</th><th class="p-1.5">適用場景</th><th class="p-1.5">上下文</th><th class="p-1.5">備註</th></tr></thead>
                <tbody>${FREE_MODEL_CATALOG.map(c => `<tr class="border-t border-slate-200/40 cursor-pointer hover:bg-indigo-500/10" onclick="previewState.model='${c.id}'; renderCanvas()">
                  <td class="p-1.5 font-mono font-semibold">${esc(c.id)}</td><td class="p-1.5">${esc(c.scene)}</td><td class="p-1.5">${esc(c.ctx)}</td><td class="p-1.5 opacity-80">${esc(c.note)}</td>
                </tr>`).join('')}</tbody>
              </table>
            </div>` : ''}
          </div>`;
        } else if (blk.type === 'kb') {
          const kbActive = previewState.kbText.length > 0;
          return `<div class="p-4 rounded-2xl border ${cardBg} space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold">📄 ${esc(isZh ? p.labelZh : p.labelEn)}</span>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${kbActive ? 'bg-teal-500/15 text-teal-600' : 'bg-slate-500/10 text-slate-400'}">${kbActive ? previewState.kbText.length + ' chars' : 'Off'}</span>
            </div>
            <div class="flex items-center gap-2">
              <label class="flex-1 cursor-pointer text-center py-1.5 px-3 rounded-xl border border-dashed border-slate-300 text-[11px] hover:border-indigo-400">
                ${previewState.kbName ? esc(previewState.kbName) : (isZh ? '上傳 .txt / .md' : 'Upload .txt / .md')}
                <input type="file" accept=".txt,.md" onchange="handlePreviewKbUpload(this)" class="hidden" />
              </label>
              ${kbActive ? `<button onclick="clearPreviewKb()" class="px-2.5 py-1.5 rounded-xl border border-slate-300/50 text-[11px]">${isZh ? '清除' : 'Clear'}</button>` : ''}
            </div>
          </div>`;
        } else if (blk.type === 'system') {
          if (!previewState.systemPrompt) previewState.systemPrompt = p.defaultPrompt;
          return `<div class="p-4 rounded-2xl border ${cardBg}">
            <label class="block text-xs font-bold mb-1.5">🎭 ${esc(isZh ? p.labelZh : p.labelEn)}</label>
            <textarea rows="2" oninput="previewState.systemPrompt=this.value" class="w-full px-3 py-2 rounded-xl border text-xs ${inputBg}">${esc(previewState.systemPrompt)}</textarea>
          </div>`;
        } else if (blk.type === 'prompts') {
          const btns = p.buttons.split(',').map(b => b.trim()).filter(Boolean);
          return `<div class="p-4 rounded-2xl border ${cardBg}">
            <div class="text-xs font-bold mb-2">⚡ ${esc(isZh ? p.labelZh : p.labelEn)}</div>
            <div class="flex flex-wrap gap-1.5">
              ${btns.map(b => `<button onclick="sendPreviewMessage('${esc(b)}')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white transition hover:opacity-90" style="background:${accent}">${esc(b)}</button>`).join('')}
            </div>
          </div>`;
        } else if (blk.type === 'params') {
          return `<div class="p-4 rounded-2xl border ${cardBg}">
            <div class="flex justify-between text-xs font-bold mb-1">
              <span>🎛️ ${esc(isZh ? p.labelZh : p.labelEn)}</span>
              <span id="tempVal">${previewState.temperature}</span>
            </div>
            <input type="range" min="0" max="2" step="0.1" value="${previewState.temperature}"
                   oninput="previewState.temperature=parseFloat(this.value); document.getElementById('tempVal').textContent=this.value"
                   class="w-full" />
          </div>`;
        } else if (blk.type === 'chat') {
          return `<div class="rounded-2xl border ${cardBg} overflow-hidden flex flex-col">
            <div class="px-4 py-2 border-b ${isLight ? 'border-slate-100 bg-slate-50/70' : 'border-slate-800'} flex items-center justify-between text-[11px]">
              <button onclick="previewState.messages=[]; renderCanvas()" class="hover:underline opacity-75">+ ${isZh ? '新對話' : 'New'}</button>
              <button onclick="exportPreviewChatMd()" class="hover:underline opacity-75">${i18n[state.lang].exportMd}</button>
            </div>
            <div id="previewChatLog" class="p-4 space-y-3 h-80 overflow-y-auto text-xs">
              <div class="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20">${esc(isZh ? p.welcomeZh : p.welcomeEn)}</div>
              ${previewState.messages.map(m => `
                <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl whitespace-pre-wrap ${m.role === 'user' ? 'text-white' : (isLight ? 'bg-slate-100 text-slate-800' : 'bg-slate-800 text-slate-100')}"
                       style="${m.role === 'user' ? 'background:' + accent : ''}">${esc(m.content)}</div>
                </div>
              `).join('')}
            </div>
            <div class="p-3 border-t ${isLight ? 'border-slate-200' : 'border-slate-800'} flex gap-2">
              <input id="previewInput" type="text" placeholder="${esc(isZh ? p.placeholderZh : p.placeholderEn)}"
                     onkeydown="if(event.key==='Enter') sendPreviewMessage()"
                     class="flex-1 px-3 py-2 rounded-xl border text-xs ${inputBg}" />
              ${previewState.isGenerating
                ? `<button onclick="stopPreviewGeneration()" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-500">${i18n[state.lang].stopBtn}</button>`
                : `<button onclick="sendPreviewMessage()" class="px-4 py-2 rounded-xl text-xs font-bold text-white" style="background:${accent}">${i18n[state.lang].sendBtn}</button>`}
            </div>
          </div>`;
        } else if (blk.type === 'empty') {
          const title = isZh ? p.titleZh : p.titleEn;
          const content = isZh ? p.contentZh : p.contentEn;
          if (!title && !content) return `<div style="height:${parseInt(p.height) || 24}px"></div>`;
          return `<div class="p-4 rounded-2xl border ${cardBg}">
            ${title ? `<div class="font-bold text-xs mb-1">${esc(title)}</div>` : ''}
            ${content ? `<div class="text-xs opacity-80 whitespace-pre-wrap">${esc(content)}</div>` : ''}
          </div>`;
        } else if (blk.type === 'footer') {
          return `<div class="text-center text-[11px] opacity-60 py-2">${esc(isZh ? p.textZh : p.textEn)}</div>`;
        }
        return '';
      };

      const outerBg = !isLight ? (state.global.theme === 'indigo' ? 'bg-indigo-950 p-6 rounded-3xl' : 'bg-slate-950 p-6 rounded-3xl') : '';
      let innerHtml = '';

      if (layout === 'split') {
        const headers = state.blocks.filter(b => b.type === 'header').map(renderPreviewBlock).join('');
        const footers = state.blocks.filter(b => b.type === 'footer').map(renderPreviewBlock).join('');
        const lefts = state.blocks.filter(b => ['apikey', 'model', 'kb', 'system', 'params', 'prompts', 'empty'].includes(b.type)).map(renderPreviewBlock).join('');
        const rights = state.blocks.filter(b => b.type === 'chat').map(renderPreviewBlock).join('');
        innerHtml = `
          <div class="space-y-4 ${outerBg}">
            ${headers}
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
              <div class="md:col-span-5 space-y-3">${lefts}</div>
              <div class="md:col-span-7 space-y-3">${rights}</div>
            </div>
            ${footers}
          </div>`;
      } else if (layout === 'card') {
        innerHtml = `<div class="max-w-2xl mx-auto p-6 rounded-3xl shadow-xl border ${isLight ? 'bg-white border-slate-200' : 'bg-slate-900 border-slate-800'} space-y-3">${state.blocks.map(renderPreviewBlock).join('')}</div>`;
      } else {
        innerHtml = `<div class="max-w-2xl mx-auto space-y-3 ${outerBg}">${state.blocks.map(renderPreviewBlock).join('')}</div>`;
      }

      container.innerHTML = innerHtml;
      const log = document.getElementById('previewChatLog');
      if (log) log.scrollTop = log.scrollHeight;
    }

    async function sendPreviewMessage(presetText) {
      const inputEl = document.getElementById('previewInput');
      const text = presetText || (inputEl ? inputEl.value.trim() : '');
      if (!text || previewState.isGenerating) return;
      if (!previewState.apiKey) {
        alert(state.lang === 'zh' ? '請先輸入您的 OpenRouter API 金鑰！' : 'Please enter your OpenRouter API Key first!');
        return;
      }
      if (inputEl && !presetText) inputEl.value = '';

      previewState.messages.push({ role: 'user', content: text });
      previewState.messages.push({ role: 'assistant', content: '⏳ 思考中...' });
      previewState.isGenerating = true;
      previewState.abortController = new AbortController();
      renderCanvas();

      try {
        const msgs = [];
        let sysContent = previewState.systemPrompt || '';
        if (previewState.kbText) {
          sysContent += `\n\n[Knowledge Base (${previewState.kbName})]:\n${previewState.kbText.slice(0, 12000)}`;
        }
        if (sysContent.trim()) msgs.push({ role: 'system', content: sysContent.trim() });
        previewState.messages.slice(0, -1).forEach(m => msgs.push(m));

        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          signal: previewState.abortController.signal,
          headers: {
            'Authorization': 'Bearer ' + toHeaderAscii(previewState.apiKey, ''),
            'Content-Type': 'application/json',
            'HTTP-Referer': toHeaderAscii(window.location.origin, 'https://openrouter.ai'),
            'X-Title': toHeaderAscii(state.global.studioNameEn, 'AI Chat Studio')
          },
          body: JSON.stringify({
            model: previewState.model || 'openrouter/free',
            messages: msgs,
            temperature: previewState.temperature
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        previewState.messages[previewState.messages.length - 1].content = data.choices[0].message.content;
      } catch (err) {
        if (err.name === 'AbortError') {
          previewState.messages[previewState.messages.length - 1].content = state.lang === 'zh' ? '⏹️ 已停止生成。' : '⏹️ Stopped.';
        } else {
          previewState.messages[previewState.messages.length - 1].content = '❌ 錯誤：' + err.message;
        }
      }
      previewState.isGenerating = false;
      previewState.abortController = null;
      renderCanvas();
    }

    // ================= 匯出獨立 index.html (含 Header 安全修復與免費模型清單) =================
    function openExportModal() {
      document.getElementById('exportCodeArea').value = generateStandaloneHTML();
      document.getElementById('exportModal').classList.remove('hidden');
      document.getElementById('exportModal').classList.add('flex');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.add('hidden');
      document.getElementById('exportModal').classList.remove('flex');
    }

    function copyExportCode() {
      const area = document.getElementById('exportCodeArea');
      area.select();
      navigator.clipboard.writeText(area.value);
      alert(i18n[state.lang].copied);
    }

    function downloadExportCode() {
      const code = document.getElementById('exportCodeArea').value;
      const blob = new Blob([code], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
    }

    function generateStandaloneHTML() {
      const cfg = JSON.stringify({ global: state.global, blocks: state.blocks });
      const catalogJson = JSON.stringify(FREE_MODEL_CATALOG);
      const isLight = state.global.theme === 'light';
      const bodyCls = isLight ? 'bg-slate-50 text-slate-900' : (state.global.theme === 'indigo' ? 'bg-indigo-950 text-slate-100' : 'bg-slate-950 text-slate-100');
      const maxW = state.global.layout === 'split' ? 'max-w-5xl' : 'max-w-2xl';

      return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${esc(state.global.studioNameZh)}</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
</head>
<body class="${bodyCls} min-h-screen py-6 px-4 font-sans">
  <div id="app" class="${maxW} mx-auto"></div>

  <script>
    const CONFIG = ${cfg};
    const CATALOG = ${catalogJson};
    let lang = 'zh';
    let apiKey = localStorage.getItem('or_api_key') || '';
    let model = 'openrouter/free';
    let systemPrompt = '';
    let kbText = '';
    let kbName = '';
    let temperature = 0.7;
    let messages = [];
    let abortCtrl = null;
    let isGen = false;
    let showGuide = false;

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function toAscii(s, fb) { const c = String(s||'').replace(/[^\\x20-\\x7E]/g,'').trim(); return c || fb; }
    function toggleLang() { lang = lang === 'zh' ? 'en' : 'zh'; render(); }

    async function refreshFree() {
      try {
        const r = await fetch('https://openrouter.ai/api/v1/models');
        const d = await r.json();
        const fetched = (d.data||[]).filter(m=>m.id==='openrouter/free'||m.id.endsWith(':free')||(parseFloat(m.pricing?.prompt)===0&&parseFloat(m.pricing?.completion)===0)).map(m=>m.id);
        const list = Array.from(new Set([...CATALOG.map(c=>c.id), ...fetched]));
        const blk = CONFIG.blocks.find(b=>b.type==='model');
        if (blk && list.length) { blk.props.models = list.slice(0,25).join(', '); render(); }
      } catch(e) { alert('Failed to fetch free models'); }
    }

    function uploadKb(inp) {
      const f = inp.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = e => { kbText = e.target.result; kbName = f.name; render(); };
      rd.readAsText(f);
    }

    function exportMd() {
      const md = messages.map(m => '### ' + (m.role==='user'?'User':'AI') + '\\n' + m.content + '\\n').join('\\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([md], {type:'text/markdown'}));
      a.download = 'chat-export.md';
      a.click();
    }

    function stopGen() { if (abortCtrl) { abortCtrl.abort(); abortCtrl=null; isGen=false; render(); } }

    function renderBlock(b) {
      const p = b.props;
      const isZh = lang === 'zh';
      const isLight = CONFIG.global.theme === 'light';
      const card = isLight ? 'bg-white border-slate-200 shadow-sm' : 'bg-slate-900/90 border-slate-800';
      const inp = isLight ? 'bg-slate-50 border-slate-300 text-slate-900' : 'bg-slate-950 border-slate-700 text-slate-100';
      const accent = CONFIG.global.accent;

      if (b.type === 'header') {
        return \`<div class="p-5 rounded-2xl border \${card} flex items-center justify-between gap-2 flex-wrap">
          <div><h1 class="text-xl font-bold" style="color:\${accent}">\${esc(isZh ? p.titleZh : p.titleEn)}</h1>
          <p class="text-xs opacity-70 mt-0.5">\${esc(isZh ? p.subtitleZh : p.subtitleEn)}</p></div>
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 border border-emerald-500/20 text-[11px] font-bold">🆓 \${esc(model)}</span>
            \${CONFIG.global.includeBilingual ? \`<button onclick="toggleLang()" class="px-3 py-1.5 rounded-xl border border-slate-300/60 text-xs font-medium">🌐 \${isZh ? 'EN' : '繁體中文'}</button>\` : ''}
          </div>
        </div>\`;
      } else if (b.type === 'apikey') {
        return \`<div class="p-4 rounded-2xl border \${card} space-y-2">
          <div class="flex justify-between items-center"><label class="text-xs font-bold">🔑 \${esc(isZh ? p.labelZh : p.labelEn)}</label>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full \${apiKey?'bg-emerald-500/15 text-emerald-600':'bg-slate-500/15 text-slate-500'}">\${apiKey?(isZh?'已連線':'Connected'):(isZh?'未連線':'Not Connected')}</span></div>
          <div class="flex gap-1.5"><input type="password" value="\${esc(apiKey)}" placeholder="\${esc(p.placeholder)}" oninput="apiKey=this.value.trim(); localStorage.setItem('or_api_key', this.value.trim())" class="flex-1 px-3 py-2 rounded-xl border text-xs \${inp}" />
          <button onclick="apiKey=''; localStorage.removeItem('or_api_key'); render()" class="px-2.5 py-1.5 rounded-xl border border-slate-300/50 text-[11px]">\${isZh?'清除':'Clear'}</button></div>
          <p class="text-[10px] opacity-65">\${isZh?'僅儲存於瀏覽器本機。免費申請金鑰：':'Stored locally. Get a free key at '}<a href="https://openrouter.ai/keys" target="_blank" class="underline text-indigo-500">openrouter.ai/keys</a></p>
        </div>\`;
      } else if (b.type === 'model') {
        const list = p.models.split(',').map(x=>x.trim()).filter(m=>m==='openrouter/free'||m.endsWith(':free'));
        if (!list.length) list.push('openrouter/free');
        if (!list.includes(model)) model = list[0];
        const meta = CATALOG.find(c=>c.id===model);
        return \`<div class="p-4 rounded-2xl border \${card} space-y-2">
          <div class="flex justify-between items-center"><label class="text-xs font-bold">🆓 \${esc(isZh ? p.labelZh : p.labelEn)}</label>
          <div class="flex gap-1.5"><button onclick="showGuide=!showGuide; render()" class="px-2 py-0.5 rounded-lg border border-slate-300/50 text-[10px]">\${isZh?'模型一覽':'Guide'}</button><button onclick="refreshFree()" class="px-2 py-0.5 rounded-lg border border-slate-300/50 text-xs">↻</button></div></div>
          <select onchange="model=this.value; render()" class="w-full px-3 py-2 rounded-xl border text-xs \${inp}">
            \${list.map(m=>{ const c=CATALOG.find(x=>x.id===m); return \`<option value="\${esc(m)}" \${m===model?'selected':''}>\${c ? esc(m+'（'+c.scene+'・'+c.ctx+'）') : esc(m)}</option>\`; }).join('')}
          </select>
          \${meta ? \`<div class="text-[11px] px-2.5 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20"><b>\${esc(meta.scene)}</b> • Context: \${esc(meta.ctx)} • \${esc(meta.note)}</div>\` : ''}
          \${showGuide ? \`<div class="overflow-x-auto border border-slate-200/60 rounded-xl"><table class="w-full text-left text-[10px]"><thead class="bg-slate-500/10"><tr><th class="p-1.5">模型 ID</th><th class="p-1.5">適用場景</th><th class="p-1.5">上下文</th><th class="p-1.5">備註</th></tr></thead><tbody>\${CATALOG.map(c=>\`<tr class="border-t border-slate-200/40 cursor-pointer hover:bg-indigo-500/10" onclick="model='\${c.id}';render()"><td class="p-1.5 font-mono font-semibold">\${esc(c.id)}</td><td class="p-1.5">\${esc(c.scene)}</td><td class="p-1.5">\${esc(c.ctx)}</td><td class="p-1.5">\${esc(c.note)}</td></tr>\`).join('')}</tbody></table></div>\` : ''}
        </div>\`;
      } else if (b.type === 'kb') {
        return \`<div class="p-4 rounded-2xl border \${card} space-y-2">
          <div class="flex justify-between items-center"><span class="text-xs font-bold">📄 \${esc(isZh?p.labelZh:p.labelEn)}</span><span class="text-[10px] font-bold">\${kbText?kbText.length+' chars':'Off'}</span></div>
          <div class="flex gap-2"><label class="flex-1 cursor-pointer text-center py-1.5 px-3 rounded-xl border border-dashed border-slate-300 text-[11px]">\${kbName?esc(kbName):(isZh?'上傳 .txt / .md':'Upload .txt / .md')}<input type="file" accept=".txt,.md" onchange="uploadKb(this)" class="hidden" /></label>
          \${kbText?\`<button onclick="kbText='';kbName='';render()" class="px-2.5 py-1.5 rounded-xl border border-slate-300/50 text-[11px]">\${isZh?'清除':'Clear'}</button>\`:''}</div>
        </div>\`;
      } else if (b.type === 'system') {
        if (!systemPrompt) systemPrompt = p.defaultPrompt;
        return \`<div class="p-4 rounded-2xl border \${card}">
          <label class="block text-xs font-bold mb-1.5">🎭 \${esc(isZh ? p.labelZh : p.labelEn)}</label>
          <textarea rows="2" oninput="systemPrompt=this.value" class="w-full px-3 py-2 rounded-xl border text-xs \${inp}">\${esc(systemPrompt)}</textarea>
        </div>\`;
      } else if (b.type === 'prompts') {
        const btns = p.buttons.split(',').map(x=>x.trim()).filter(Boolean);
        return \`<div class="p-4 rounded-2xl border \${card}">
          <div class="text-xs font-bold mb-2">⚡ \${esc(isZh ? p.labelZh : p.labelEn)}</div>
          <div class="flex flex-wrap gap-1.5">
            \${btns.map(bt=>\`<button onclick="sendMsg('\${esc(bt)}')" class="px-3 py-1.5 rounded-xl text-xs font-medium text-white" style="background:\${accent}">\${esc(bt)}</button>\`).join('')}
          </div>
        </div>\`;
      } else if (b.type === 'params') {
        return \`<div class="p-4 rounded-2xl border \${card}">
          <div class="flex justify-between text-xs font-bold mb-1"><span>🎛️ \${esc(isZh ? p.labelZh : p.labelEn)}</span><span id="tv">\${temperature}</span></div>
          <input type="range" min="0" max="2" step="0.1" value="\${temperature}" oninput="temperature=parseFloat(this.value); document.getElementById('tv').textContent=this.value" class="w-full" />
        </div>\`;
      } else if (b.type === 'chat') {
        return \`<div class="rounded-2xl border \${card} overflow-hidden flex flex-col">
          <div class="px-4 py-2 border-b \${isLight?'border-slate-100':'border-slate-800'} flex justify-between text-[11px]">
            <button onclick="messages=[];render()">+ \${isZh?'新對話':'New'}</button>
            <button onclick="exportMd()">⬇ \${isZh?'匯出對話 (.md)':'Export Chat (.md)'}</button>
          </div>
          <div id="chatLog" class="p-4 space-y-3 h-96 overflow-y-auto text-sm">
            <div class="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs">\${esc(isZh ? p.welcomeZh : p.welcomeEn)}</div>
            \${messages.map(m=>\`<div class="flex \${m.role==='user'?'justify-end':'justify-start'}">
              <div class="max-w-[85%] px-4 py-2.5 rounded-2xl whitespace-pre-wrap text-xs \${m.role==='user'?'text-white':(isLight?'bg-slate-100 text-slate-800':'bg-slate-800')}"
                   style="\${m.role==='user'?'background:'+accent:''}">\${esc(m.content)}</div>
            </div>\`).join('')}
          </div>
          <div class="p-3 border-t \${isLight?'border-slate-200':'border-slate-800'} flex gap-2">
            <input id="chatInp" type="text" placeholder="\${esc(isZh ? p.placeholderZh : p.placeholderEn)}"
                   onkeydown="if(event.key==='Enter') sendMsg()" class="flex-1 px-3 py-2 rounded-xl border text-xs \${inp}" />
            \${isGen?\`<button onclick="stopGen()" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-rose-500">\${isZh?'停止':'Stop'}</button>\`:\`<button onclick="sendMsg()" class="px-4 py-2 rounded-xl text-xs font-bold text-white" style="background:\${accent}">\${isZh?'發送':'Send'}</button>\`}
          </div>
        </div>\`;
      } else if (b.type === 'empty') {
        const title = isZh ? p.titleZh : p.titleEn;
        const content = isZh ? p.contentZh : p.contentEn;
        if (!title && !content) return \`<div style="height:\${parseInt(p.height)||24}px"></div>\`;
        return \`<div class="p-4 rounded-2xl border \${card}">\${title?\`<div class="font-bold text-xs mb-1">\${esc(title)}</div>\`:''}\${content?\`<div class="text-xs opacity-80 whitespace-pre-wrap">\${esc(content)}</div>\`:''}</div>\`;
      } else if (b.type === 'footer') {
        return \`<div class="text-center text-xs opacity-60 py-2">\${esc(isZh ? p.textZh : p.textEn)}</div>\`;
      }
      return '';
    }

    function render() {
      const layout = CONFIG.global.layout || 'single';
      const isLight = CONFIG.global.theme === 'light';
      let html = '';

      if (layout === 'split') {
        const headers = CONFIG.blocks.filter(b => b.type === 'header').map(renderBlock).join('');
        const footers = CONFIG.blocks.filter(b => b.type === 'footer').map(renderBlock).join('');
        const lefts = CONFIG.blocks.filter(b => ['apikey', 'model', 'kb', 'system', 'params', 'prompts', 'empty'].includes(b.type)).map(renderBlock).join('');
        const rights = CONFIG.blocks.filter(b => b.type === 'chat').map(renderBlock).join('');
        html = \`<div class="space-y-4">\${headers}<div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start"><div class="md:col-span-5 space-y-3">\${lefts}</div><div class="md:col-span-7 space-y-3">\${rights}</div></div>\${footers}</div>\`;
      } else if (layout === 'card') {
        html = \`<div class="p-6 rounded-3xl shadow-xl border \${isLight ? 'bg-white border-slate-200' : 'bg-slate-900 border-slate-800'} space-y-3">\${CONFIG.blocks.map(renderBlock).join('')}</div>\`;
      } else {
        html = \`<div class="space-y-3">\${CONFIG.blocks.map(renderBlock).join('')}</div>\`;
      }

      document.getElementById('app').innerHTML = html;
      const log = document.getElementById('chatLog');
      if (log) log.scrollTop = log.scrollHeight;
    }

    async function sendMsg(preset) {
      const inp = document.getElementById('chatInp');
      const text = preset || (inp ? inp.value.trim() : '');
      if (!text || isGen) return;
      if (!apiKey) return alert(lang === 'zh' ? '請先輸入您的 OpenRouter API 金鑰！' : 'Please enter your OpenRouter API Key!');
      if (inp && !preset) inp.value = '';

      messages.push({ role: 'user', content: text });
      messages.push({ role: 'assistant', content: '⏳ 思考中...' });
      isGen = true;
      abortCtrl = new AbortController();
      render();

      try {
        const payload = [];
        let sys = systemPrompt || '';
        if (kbText) sys += '\\n\\n[Knowledge Base ('+kbName+')]:\\n' + kbText.slice(0,12000);
        if (sys.trim()) payload.push({ role: 'system', content: sys.trim() });
        messages.slice(0, -1).forEach(m => payload.push(m));
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          signal: abortCtrl.signal,
          headers: {
            'Authorization': 'Bearer ' + toAscii(apiKey, ''),
            'Content-Type': 'application/json',
            'HTTP-Referer': toAscii(window.location.origin, 'https://openrouter.ai'),
            'X-Title': toAscii(CONFIG.global.studioNameEn, 'AI Chat Studio')
          },
          body: JSON.stringify({ model: model || 'openrouter/free', messages: payload, temperature })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        messages[messages.length - 1].content = data.choices[0].message.content;
      } catch (e) {
        messages[messages.length - 1].content = e.name === 'AbortError' ? (lang==='zh'?'⏹️ 已停止。':'⏹️ Stopped.') : ('❌ 錯誤：' + e.message);
      }
      isGen = false;
      abortCtrl = null;
      render();
    }

    render();
  <\/script>
</body>
</html>`;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
</html>
